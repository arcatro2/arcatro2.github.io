<!DOCTYPE html>
<html lang="ko" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TXT File Workspace</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.8);
        }
        /* Uniform column styling */
        .column {
            height: 520px;
            transition: transform 0.2s ease, opacity 0.2s ease, border 0.15s ease;
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col antialiased transition-colors duration-300">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-30 backdrop-blur-xl bg-white/80 dark:bg-slate-900/80 border-b border-slate-200/80 dark:border-slate-800 px-4 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <div>
                <h1 class="font-semibold text-base tracking-tight">TXT Workspace</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400" id="header-file-count">폴더가 선택되지 않음</p>
            </div>
        </div>

        <!-- Action Controls -->
        <div class="flex items-center gap-2 flex-wrap">
            <button id="btn-load-dir" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-xs font-medium rounded-xl shadow-sm shadow-indigo-600/20 transition-all flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                폴더 열기
            </button>
            <button id="btn-add-column" class="px-3.5 py-2 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 text-xs font-medium rounded-xl shadow-sm transition-all flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                섹션 추가
            </button>
            <button id="btn-save-all" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white text-xs font-medium rounded-xl shadow-sm shadow-emerald-600/20 transition-all flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                전체 저장
            </button>
            <div class="h-5 w-[1px] bg-slate-200 dark:bg-slate-800 mx-1"></div>
            <!-- Settings Modal Trigger -->
            <button id="btn-open-settings" class="p-2.5 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm transition-all" title="환경설정 및 커스텀">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="flex-1 p-4 lg:p-6 flex flex-col gap-6 max-w-[1920px] w-full mx-auto">
        
        <!-- Workspace Columns Container with uniform height and drop indicators -->
        <div id="workspace" class="flex gap-4 overflow-x-auto pb-4 items-stretch">
            <!-- Dynamic columns inserted here -->
        </div>

        <!-- Combined Output & Template Section -->
        <section class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 shadow-sm flex flex-col gap-4 animate-fade-in">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-indigo-500"></div>
                    <h2 class="font-semibold text-sm tracking-tight">선택한 문자열 조합</h2>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-clear-lines" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-medium rounded-lg transition-all">선택 초기화</button>
                    <button id="btn-copy-combined" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-lg shadow-sm transition-all flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        복사하기
                    </button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-medium text-slate-500 dark:text-slate-400">조합 템플릿 형식</label>
                    <input type="text" id="template-input" class="w-full px-3.5 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all" placeholder="틀 입력 (예: A girl is <1>, A boy is <2>)" value="<template>">
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-medium text-slate-500 dark:text-slate-400">최종 결과 출력</label>
                    <div id="combined-output" class="w-full h-[76px] bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-xs font-mono overflow-y-auto select-all text-slate-700 dark:text-slate-300"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Settings & Customization Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform scale-95 transition-all duration-300" id="settings-modal-content">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
                <h3 class="font-semibold text-sm">환경 설정 및 커스텀</h3>
                <button id="btn-close-settings" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-6 flex flex-col gap-5">
                <!-- Theme Mode -->
                <div class="flex items-center justify-between">
                    <div>
                        <h4 class="text-xs font-semibold">테마 모드</h4>
                        <p class="text-[11px] text-slate-500 dark:text-slate-400">화면 라이트/다크 모드를 전환합니다.</p>
                    </div>
                    <button id="btn-theme-toggle" class="px-3.5 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl text-xs font-medium transition-all flex items-center gap-2">
                        <span id="theme-icon">🌙</span> <span id="theme-text">다크모드</span>
                    </button>
                </div>
                <!-- Column Width Preference -->
                <div class="flex flex-col gap-2">
                    <div class="flex items-center justify-between">
                        <h4 class="text-xs font-semibold">섹션 너비 설정</h4>
                        <span id="col-width-val" class="text-xs font-mono text-indigo-600 dark:text-indigo-400">380px</span>
                    </div>
                    <input type="range" id="range-col-width" min="300" max="500" value="380" step="10" class="w-full accent-indigo-600 cursor-pointer">
                </div>
                <!-- Font Size Preference -->
                <div class="flex flex-col gap-2">
                    <div class="flex items-center justify-between">
                        <h4 class="text-xs font-semibold">에디터 글자 크기</h4>
                        <span id="font-size-val" class="text-xs font-mono text-indigo-600 dark:text-indigo-400">13px</span>
                    </div>
                    <input type="range" id="range-font-size" min="11" max="16" value="13" step="1" class="w-full accent-indigo-600 cursor-pointer">
                </div>
            </div>
            <div class="px-6 py-3.5 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 flex justify-end">
                <button id="btn-save-settings" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-xl shadow-sm transition-all">확인</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Fallback Hidden File Input -->
    <input type="file" id="fallback-file-input" webkitdirectory directory multiple class="hidden">

    <script>
        /**
         * 애플리케이션 상태 관리 구조체
         */
        const state = {
            dirHandle: null,
            filesMap: new Map(),
            fileContents: new Map(),
            originalContents: new Map(),
            selectedLines: new Map(),
            nextColumnId: 1,
            isFallback: false,
            settings: {
                colWidth: 380,
                fontSize: 13,
                darkMode: false
            }
        };

        // DOM 캐싱
        const workspace = document.getElementById('workspace');
        const headerFileCount = document.getElementById('header-file-count');
        const combinedOutput = document.getElementById('combined-output');
        const templateInput = document.getElementById('template-input');
        const fallbackFileInput = document.getElementById('fallback-file-input');
        const settingsModal = document.getElementById('settings-modal');
        const settingsModalContent = document.getElementById('settings-modal-content');

        /**
         * 애니메이션 토스트 알림 표시 함수
         */
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-900 text-white dark:bg-white dark:text-slate-900';
            if (type === 'success') bgClass = 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/20';
            if (type === 'warning') bgClass = 'bg-amber-500 text-white shadow-lg shadow-amber-500/20';
            if (type === 'error') bgClass = 'bg-rose-600 text-white shadow-lg shadow-rose-600/20';

            toast.className = `pointer-events-auto px-4 py-3 rounded-2xl text-xs font-medium shadow-xl flex items-center gap-3 animate-fade-in ${bgClass}`;
            
            let iconSvg = '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
            if (type === 'success') iconSvg = '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
            if (type === 'warning' || type === 'error') iconSvg = '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>';

            toast.innerHTML = `${iconSvg}<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 설정 모달 열기/닫기 제어
        document.getElementById('btn-open-settings').addEventListener('click', () => {
            settingsModal.classList.remove('pointer-events-none', 'opacity-0');
            settingsModalContent.classList.remove('scale-95');
            settingsModalContent.classList.add('scale-100');
        });

        function closeModal() {
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            settingsModalContent.classList.remove('scale-100');
            settingsModalContent.classList.add('scale-95');
        }

        document.getElementById('btn-close-settings').addEventListener('click', closeModal);
        document.getElementById('btn-save-settings').addEventListener('click', closeModal);
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeModal();
        });

        // 테마 토글
        const btnThemeToggle = document.getElementById('btn-theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        btnThemeToggle.addEventListener('click', () => {
            state.settings.darkMode = !state.settings.darkMode;
            applyTheme();
        });

        function applyTheme() {
            if (state.settings.darkMode) {
                document.documentElement.classList.add('dark');
                themeIcon.textContent = '☀️';
                themeText.textContent = '라이트모드';
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.textContent = '🌙';
                themeText.textContent = '다크모드';
            }
        }

        // 슬라이더 커스텀 설정
        const rangeColWidth = document.getElementById('range-col-width');
        const colWidthVal = document.getElementById('col-width-val');
        rangeColWidth.addEventListener('input', (e) => {
            state.settings.colWidth = parseInt(e.target.value, 10);
            colWidthVal.textContent = state.settings.colWidth + 'px';
            document.querySelectorAll('.column').forEach(col => {
                col.style.minWidth = state.settings.colWidth + 'px';
                col.style.width = state.settings.colWidth + 'px';
            });
        });

        const rangeFontSize = document.getElementById('range-font-size');
        const fontSizeVal = document.getElementById('font-size-val');
        rangeFontSize.addEventListener('input', (e) => {
            state.settings.fontSize = parseInt(e.target.value, 10);
            fontSizeVal.textContent = state.settings.fontSize + 'px';
            document.querySelectorAll('.line-item, textarea.raw-editor').forEach(el => {
                el.style.fontSize = state.settings.fontSize + 'px';
            });
        });

        /**
         * 1. 폴더 로드 기능 (File System Access API & Fallback)
         */
        document.getElementById('btn-load-dir').addEventListener('click', async () => {
            state.filesMap.clear();
            state.fileContents.clear();

            if ('showDirectoryPicker' in window) {
                try {
                    state.dirHandle = await window.showDirectoryPicker();
                    state.isFallback = false;

                    for await (const entry of state.dirHandle.values()) {
                        if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.txt')) {
                            state.filesMap.set(entry.name, entry);
                            const file = await entry.getFile();
                            const text = await file.text();
                            state.fileContents.set(entry.name, text);
                            state.originalContents.set(entry.name, text);
                        }
                    }
                    headerFileCount.textContent = `불러온 txt 파일: ${state.filesMap.size}개`;
                    showToast(`총 ${state.filesMap.size}개의 txt 파일을 불러왔습니다.`, 'success');

                    let PRESET_FILES = [];
                    try {
                        const presetFileHandle = await state.dirHandle.getFileHandle('preset_files.txt');
                        const presetFile = await presetFileHandle.getFile();
                        const presetText = await presetFile.text();
                        PRESET_FILES = presetText.split(/\r?\n/).map(s => s.trim()).filter(Boolean);

                        workspace.innerHTML = '';
                        state.selectedLines.clear();
                        PRESET_FILES.forEach(fileName => addColumn(fileName));
                    } catch (err) {}

                    updateAllDropdowns();
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.warn('showDirectoryPicker 실패, fallback으로 전환합니다.', err);
                        fallbackFileInput.click();
                    }
                }
            } else {
                fallbackFileInput.click();
            }
        });

        fallbackFileInput.addEventListener('change', async (e) => {
            state.isFallback = true;
            const files = e.target.files;

            for (const file of files) {
                if (file.name.toLowerCase().endsWith('.txt')) {
                    state.filesMap.set(file.name, file);
                    const text = await file.text();
                    state.fileContents.set(file.name, text);
                    state.originalContents.set(file.name, text);
                }
            }

            headerFileCount.textContent = `불러온 txt 파일: ${state.filesMap.size}개 (보안 fallback 모드)`;
            showToast(`${state.filesMap.size}개 파일 로드 완료 (Fallback 모드)`, 'warning');
            updateAllDropdowns();
        });

        function isEditModeActiveForFile(fileName, currentColumn) {
            if (!fileName) return false;
            const columns = workspace.querySelectorAll('.column');
            for (const col of columns) {
                if (col !== currentColumn) {
                    const selectEl = col.querySelector('.file-select');
                    const isLineMode = col.dataset.isLineMode === 'true';
                    if (selectEl.value === fileName && !isLineMode) return true;
                }
            }
            return false;
        }

        /**
         * 2. 섹션(칼럼) 생성 및 드래그 앤 드롭 (사이에 정확히 삽입되는 점선 표시 인디케이터 포함)
         */
        document.getElementById('btn-add-column').addEventListener('click', () => {
            addColumn();
        });

        function addColumn(fileNameToSelect = "") {
            const colId = state.nextColumnId++;
            const colEl = document.createElement('div');
            colEl.className = 'column flex flex-col bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm overflow-hidden flex-shrink-0 animate-fade-in transition-all';
            colEl.style.minWidth = state.settings.colWidth + 'px';
            colEl.style.width = state.settings.colWidth + 'px';
            colEl.dataset.id = colId;
            colEl.dataset.isLineMode = 'true';
            colEl.draggable = true;

            colEl.innerHTML = `
                <div class="column-header p-3 bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200/80 dark:border-slate-800 flex items-center gap-2 cursor-grab active:cursor-grabbing">
                    <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/></svg>
                    <select class="file-select flex-1 px-2.5 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-medium rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                        <option value="">-- 파일 선택 --</option>
                    </select>
                    <button class="btn-toggle-view px-2.5 py-1.5 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-medium rounded-xl transition-all" title="라인선택/직접수정 전환">전환</button>
                    <button class="btn-remove-col p-1.5 text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/30 rounded-xl transition-all" title="삭제">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
                <div class="editor-container flex-1 flex flex-col overflow-hidden">
                    <div class="line-view flex-1 overflow-y-auto bg-slate-50/50 dark:bg-slate-950/50"></div>
                    <textarea class="raw-editor flex-1 w-full bg-transparent p-3 font-mono focus:outline-none resize-none" placeholder="파일을 선택하세요." style="display: none; font-size: ${state.settings.fontSize}px;"></textarea>
                </div>
            `;

            workspace.appendChild(colEl);

            const selectEl = colEl.querySelector('.file-select');
            const textareaEl = colEl.querySelector('.raw-editor');
            const lineViewEl = colEl.querySelector('.line-view');
            const toggleBtn = colEl.querySelector('.btn-toggle-view');
            const removeBtn = colEl.querySelector('.btn-remove-col');

            populateDropdown(selectEl);

            if (fileNameToSelect && state.filesMap.has(fileNameToSelect)) {
                selectEl.value = fileNameToSelect;
                textareaEl.value = state.fileContents.get(fileNameToSelect) || '';
            }

            selectEl.addEventListener('change', () => {
                const fileName = selectEl.value;
                if (fileName && state.fileContents.has(fileName)) {
                    textareaEl.value = state.fileContents.get(fileName);
                } else {
                    textareaEl.value = '';
                }
                colEl.dataset.isLineMode = 'true';
                lineViewEl.style.display = 'block';
                textareaEl.style.display = 'none';

                state.selectedLines.delete(colId);
                renderLineView(colEl);
                updateCombinedDisplay();
            });

            textareaEl.addEventListener('input', () => {
                const fileName = selectEl.value;
                if (fileName) state.fileContents.set(fileName, textareaEl.value);
            });

            toggleBtn.addEventListener('click', () => {
                const isLineMode = colEl.dataset.isLineMode === 'true';
                const fileName = selectEl.value;

                if (isLineMode) {
                    if (fileName && isEditModeActiveForFile(fileName, colEl)) {
                        showToast(`'${fileName}' 파일은 이미 다른 섹션에서 편집 모드로 열려있습니다.`, 'warning');
                        return;
                    }
                    colEl.dataset.isLineMode = 'false';
                    lineViewEl.style.display = 'none';
                    textareaEl.style.display = 'block';
                } else {
                    colEl.dataset.isLineMode = 'true';
                    if (fileName) {
                        const updatedContent = textareaEl.value;
                        workspace.querySelectorAll('.column').forEach(otherCol => {
                            const otherSelect = otherCol.querySelector('.file-select');
                            if (otherSelect && otherSelect.value === fileName) {
                                const otherTextarea = otherCol.querySelector('.raw-editor');
                                if (otherTextarea) otherTextarea.value = updatedContent;
                                if (otherCol.dataset.isLineMode === 'true') renderLineView(otherCol);
                            }
                        });
                    }
                    renderLineView(colEl);
                    lineViewEl.style.display = 'block';
                    textareaEl.style.display = 'none';
                    updateCombinedDisplay();
                }
            });

            removeBtn.addEventListener('click', () => {
                state.selectedLines.delete(colId);
                colEl.remove();
                updateCombinedDisplay();
            });

            // Precise Drag and Drop Reordering with Dashed Indicators between sections
            colEl.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', colId);
                setTimeout(() => colEl.classList.add('opacity-40', 'scale-95'), 0);
            });

            colEl.addEventListener('dragend', () => {
                colEl.classList.remove('opacity-40', 'scale-95');
                clearDropIndicators();
            });

            colEl.addEventListener('dragover', (e) => {
                e.preventDefault();
                const rect = colEl.getBoundingClientRect();
                const midpoint = rect.left + rect.width / 2;
                clearDropIndicators();

                if (e.clientX < midpoint) {
                    colEl.classList.add('border-l-4', 'border-dashed', 'border-indigo-500');
                    colEl.dataset.dropSide = 'left';
                } else {
                    colEl.classList.add('border-r-4', 'border-dashed', 'border-indigo-500');
                    colEl.dataset.dropSide = 'right';
                }
            });

            colEl.addEventListener('dragleave', (e) => {
                if (e.target === colEl) {
                    colEl.classList.remove('border-l-4', 'border-r-4', 'border-dashed', 'border-indigo-500');
                    delete colEl.dataset.dropSide;
                }
            });

            colEl.addEventListener('drop', (e) => {
                e.preventDefault();
                clearDropIndicators();
                const draggedId = e.dataTransfer.getData('text/plain');
                const draggedCol = workspace.querySelector(`[data-id="${draggedId}"]`);
                if (draggedCol && draggedCol !== colEl) {
                    const dropSide = colEl.dataset.dropSide || 'left';
                    if (dropSide === 'left') {
                        workspace.insertBefore(draggedCol, colEl);
                    } else {
                        workspace.insertBefore(draggedCol, colEl.nextSibling);
                    }
                }
                delete colEl.dataset.dropSide;
            });

            renderLineView(colEl);
        }

        function clearDropIndicators() {
            workspace.querySelectorAll('.column').forEach(c => {
                c.classList.remove('border-l-4', 'border-r-4', 'border-dashed', 'border-indigo-500');
                delete c.dataset.dropSide;
            });
        }

        function populateDropdown(selectEl) {
            const currentVal = selectEl.value;
            selectEl.innerHTML = '<option value="">-- 파일 선택 --</option>';
            for (const fileName of state.filesMap.keys()) {
                const opt = document.createElement('option');
                opt.value = fileName;
                opt.textContent = fileName;
                selectEl.appendChild(opt);
            }
            selectEl.value = currentVal;
        }

        function updateAllDropdowns() {
            document.querySelectorAll('.file-select').forEach(select => populateDropdown(select));
        }

        /**
         * 라인 뷰 렌더링 함수 (줄바꿈 허용으로 모든 문장 표시)
         */
        function renderLineView(colEl) {
            const colId = parseInt(colEl.dataset.id, 10);
            const textareaEl = colEl.querySelector('.raw-editor');
            const lineViewEl = colEl.querySelector('.line-view');
            const lines = textareaEl.value.split('\n');
            const colSelections = state.selectedLines.get(colId);

            lineViewEl.innerHTML = '';
            lines.forEach((lineText, idx) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'px-3 py-2 font-mono text-xs cursor-pointer border-b border-slate-100 dark:border-slate-800/60 transition-all select-none whitespace-pre-wrap break-all hover:bg-slate-100 dark:hover:bg-slate-800/80';
                lineDiv.style.fontSize = state.settings.fontSize + 'px';
                lineDiv.textContent = lineText === '' ? ' ' : lineText;

                if (colSelections && colSelections.has(idx)) {
                    lineDiv.className += ' bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 font-semibold border-emerald-200 dark:border-emerald-900/50';
                }

                lineDiv.addEventListener('click', () => {
                    toggleLineSelection(colEl, idx, lineText);
                });

                lineViewEl.appendChild(lineDiv);
            });
        }

        function toggleLineSelection(colEl, lineIdx, text) {
            const colId = parseInt(colEl.dataset.id, 10);
            if (!state.selectedLines.has(colId)) {
                state.selectedLines.set(colId, new Map());
            }
            const colSelections = state.selectedLines.get(colId);
            if (colSelections.has(lineIdx)) {
                colSelections.delete(lineIdx);
                if (colSelections.size === 0) state.selectedLines.delete(colId);
            } else {
                colSelections.set(lineIdx, text);
            }
            renderLineView(colEl);
            updateCombinedDisplay();
        }

        function getSectionCombinedText(colId) {
            const colSelections = state.selectedLines.get(colId);
            if (!colSelections || colSelections.size === 0) return '';
            const sortedIndices = Array.from(colSelections.keys()).sort((a, b) => a - b);
            return sortedIndices.map(idx => colSelections.get(idx)).join(', ');
        }

        templateInput.addEventListener('input', updateCombinedDisplay);

        function updateCombinedDisplay() {
            const columns = workspace.querySelectorAll('.column');
            const fileToTextListMap = new Map();

            columns.forEach(col => {
                const colId = parseInt(col.dataset.id, 10);
                const selectEl = col.querySelector('.file-select');
                const fullFileName = selectEl ? selectEl.value : '';

                if (fullFileName) {
                    const baseName = fullFileName.replace(/\.[^/.]+$/, '');
                    if (!fileToTextListMap.has(baseName)) {
                        fileToTextListMap.set(baseName, []);
                    }
                    const combinedText = getSectionCombinedText(colId);
                    fileToTextListMap.get(baseName).push(combinedText);
                }
            });

            const template = templateInput.value;

            if (template.trim() !== '') {
                const queues = new Map();
                fileToTextListMap.forEach((arr, key) => {
                    queues.set(key, [...arr]);
                });

                let currentResult = template;
                const MAX_RECURSION = 10;

                for (let i = 0; i < MAX_RECURSION; i++) {
                    let replacedAny = false;
                    const nextResult = currentResult.replace(/<([^>]+)>/g, (match, rawName) => {
                        const queue = queues.get(rawName);
                        if (queue && queue.length > 0) {
                            replacedAny = true;
                            return queue.shift();
                        }
                        return match;
                    });
                    if (!replacedAny || nextResult === currentResult) break;
                    currentResult = nextResult;
                }

                combinedOutput.textContent = cleanCommas(currentResult.replace(/<([^>]+)>/g, ''));
            } else {
                const resultTexts = [];
                columns.forEach(col => {
                    const colId = parseInt(col.dataset.id, 10);
                    const sectionText = getSectionCombinedText(colId);
                    if (sectionText) resultTexts.push(sectionText);
                });
                combinedOutput.textContent = cleanCommas(resultTexts.join(', '));
            }
        }

        function cleanCommas(text) {
            return text
                .replace(/(?:\s*,)+/g, ',')
                .replace(/,\s*/g, ', ')
                .replace(/^[\s,]+|[\s,]+$/g, '')
                .trim();
        }

        document.getElementById('btn-clear-lines').addEventListener('click', () => {
            state.selectedLines.clear();
            document.querySelectorAll('.column').forEach(col => renderLineView(col));
            updateCombinedDisplay();
            showToast('라인 선택이 초기화되었습니다.', 'info');
        });

        document.getElementById('btn-copy-combined').addEventListener('click', () => {
            const textToCopy = combinedOutput.textContent;
            if (!textToCopy) {
                showToast('복사할 내용이 없습니다.', 'warning');
                return;
            }
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = textToCopy;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            showToast('클립보드에 복사되었습니다.', 'success');
        });

        /**
         * 3. 파일 전체 저장 기능
         */
        document.getElementById('btn-save-all').addEventListener('click', async () => {
            if (state.filesMap.size === 0) {
                showToast('저장할 파일이 없습니다.', 'warning');
                return;
            }

            const modifiedFiles = [];
            for (const [fileName, currentContent] of state.fileContents.entries()) {
                if (currentContent !== state.originalContents.get(fileName)) {
                    modifiedFiles.push({ fileName, content: currentContent });
                }
            }

            if (modifiedFiles.length === 0) {
                showToast('수정된 파일이 없습니다.', 'info');
                return;
            }

            let savedCount = 0;

            if (!state.isFallback && state.dirHandle) {
                try {
                    for (const item of modifiedFiles) {
                        const handle = state.filesMap.get(item.fileName);
                        if (handle && handle.createWritable) {
                            const writable = await handle.createWritable();
                            await writable.write(item.content);
                            await writable.close();
                            state.originalContents.set(item.fileName, item.content);
                            savedCount++;
                        }
                    }
                    showToast(`수정된 ${savedCount}개 파일 저장 완료`, 'success');
                } catch (err) {
                    showToast('파일 저장 중 오류가 발생했습니다.', 'error');
                    console.error(err);
                }
            } else {
                for (const item of modifiedFiles) {
                    const blob = new Blob([item.content], { type: 'text/plain;charset=utf-8' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = item.fileName;
                    a.click();
                    URL.revokeObjectURL(a.href);
                    state.originalContents.set(item.fileName, item.content);
                    savedCount++;
                }
                showToast(`수정된 ${savedCount}개 파일 다운로드 완료`, 'success');
            }
        });

        // 초기 시작 시 기본 칼럼 1개 추가
        window.addEventListener('DOMContentLoaded', () => {
            addColumn();
        });
    </script>
</body>
